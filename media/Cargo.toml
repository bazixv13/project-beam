[package]
name = "beam-media"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "time", "process"] }
axum = { version = "0.7", features = ["multipart"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Fast-link profile for dev CI deploys (deploy-media.yml builds with
# `cargo build --profile dev-release`). Same opts, thin LTO + parallel
# codegen so cache-miss builds finish much sooner.
[profile.dev-release]
inherits = "release"
lto = "thin"
codegen-units = 16

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="BEAM — peer-to-peer file transfer between browsers. No cloud, no storage." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beam</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved ? saved : (prefDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);

          var savedLang = localStorage.getItem('lang');
          var sysLang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
          var initialLang = savedLang || (sysLang.toLowerCase().startsWith('pl') ? 'pl' : 'en');
          document.documentElement.setAttribute('lang', initialLang);

          // Paint the phone status bar to match the theme before first render
          // (--bg-app: #ffffff light / #000000 dark) to avoid a color flash.
          // Note: recreated (not setAttribute) — Chrome Android only reacts
          // to a brand-new theme-color node.
          try {
            var oldMeta = document.querySelector('meta[name="theme-color"]');
            if (oldMeta) oldMeta.remove();
            var themeMeta = document.createElement('meta');
            themeMeta.name = 'theme-color';
            themeMeta.content = theme === 'dark' ? '#000000' : '#ffffff';
            document.head.appendChild(themeMeta);
          } catch (_) {}
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
